# PRODUCTION stack portofolio (pola sama seperti webrent)
# - app  : php:8.3-fpm-alpine (kode aplikasi, image di-tag IMAGE_TAG)
# - web  : nginx:alpine, document root public/, port 127.0.0.1:8080:80
# - db   : mysql:8, hanya internal, data persist di volume db_data
# - uploads: volume bersama app <-> web untuk gambar yang di-upload

services:
  app:
    build:
      context: ../
      dockerfile: Dockerfile
    image: portfolio-html:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-portfolio_db}
      DB_USER: ${DB_USER:-portfolio}
      DB_PASS: ${DB_PASS:?set DB_PASS di .env}
      APP_ENV: production
      APP_DEBUG: ${APP_DEBUG:-false}
      BASE_URL: ${BASE_URL:-http://localhost:8080}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
    volumes:
      - uploads:/var/www/html/public/uploads
    depends_on:
      db:
        condition: service_healthy

  web:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT:-8080}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ../public:/var/www/html/public:ro
      - uploads:/var/www/html/public/uploads:ro
    depends_on:
      - app

  db:
    image: mysql:8.0
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${DB_NAME:-portfolio_db}
      MYSQL_USER: ${DB_USER:-portfolio}
      MYSQL_PASSWORD: ${DB_PASS:?set DB_PASS di .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS:?set DB_ROOT_PASS di .env}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  db_data:
  uploads:
