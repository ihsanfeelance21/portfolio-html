# Portofolio — PHP via fastcgi ke app:9000
# Akses sementara via IP server:8080

server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    # Kode aplikasi & file sensitif TIDAK boleh diakses lewat web
    location ~ ^/(app|database|vendor|config) {
        deny all;
    }
    location ~* \.(env|sql|log|ini|md|lock)$ {
        deny all;
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Asset statis
    location ~* \.(css|js)$ {
        expires 1d;
        add_header Cache-Control "public";
    }

    # Upload gambar (volume bersama)
    location /uploads/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # PHP
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # Front controller untuk clean URL
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
}
